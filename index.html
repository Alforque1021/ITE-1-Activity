<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Multimedia Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Multimedia Page</h1>

    <!-- Favourite Photo Section -->
    <div class="section-box">
        <div class="section-title">Favourite Photo</div>
        <img src="Bilat.jpg" alt="Photo 1" class="custom-img">
        <img src="OC.jpg" alt="Photo 2" class="custom-img">
        <img src="hutao.jpg" alt="Photo 3" class="custom-img">
        <img src="red_field.jpg" alt="Photo 4" class="custom-img">
        <img src="Teehee.jpg" alt="Photo 5" class="custom-img">
    </div>

    <!-- Music List Section -->
    <div class="section-title">Music List</div>
<div class="media-card">
                <div>
                    <h3>4me 4me</h3>
                    <p>Malcolm Todd</p>
                </div>
                <audio controls>
                    <source src="4me 4me malcolm todd.mp3" type="audio/mpeg">
                </audio>
</div>
<div class="media-card">
                <div>
                    <h3>urn</h3>
                    <p>Crying City</p>
                </div>
                <audio controls>
                    <source src="Crying City - Urn (Official Lyric Video).mp3" type="audio/mpeg">
                </audio>
</div>
    <div class="media-card">
                <div>
                    <h3>Unlearning You</h3>
                    <p>Crying City</p>
                </div>
                <audio controls>
                    <source src="Crying City - unlearning you (Official Visualizer) [iCKiEshXOC0] (1).mp3" type="audio/mpeg">
                </audio>
</div>
    <div class="media-card">
                <div>
                    <h3>Fortnight</h3>
                    <p>Taylor Swift Feat. Post malone</p>
                </div>
                <audio controls>
                    <source src="Taylor Swift feat. Post Malone - Fortnight (Lyrics).mp3" type="audio/mpeg">
                </audio>
</div>
    <div class="media-card">
                <div>
                    <h3>Sariling Multo</h3>
                    <p>IVOS</p>
                </div>
                <audio controls>
                    <source src="IV OF SPADES - Sariling Multo (Sa Panaginip).mp3" type="audio/mpeg">
                </audio>
</div>
    <!-- Video List Section -->
    <section>
    <div class="section-box">
        <div class="section-title">Dream Destination</div>
        <div class="media-card">
                <div>
                    <h3>Japan</h3>
                <video controls>
                    <source src="Japan.mp4" type="video/mp4">
                </video>
                    <h3>Texas</h3>
                <video controls>
                    <source src="Texas.mp4" type="video/mp4">
                </video>
                    <h3>California</h3>
                <video controls>
                    <source src="California.mp4" type="video/mp4">
                </video>
                    <h3>Paris</h3>
                <video controls>
                    <source src="Paris.mp4" type="video/mp4">
                </video>
                    <h3>Canada</h3>
                <video controls>
                    <source src="canada.mp4" type="video/mp4">
                </video>
            </div>
            
    </section>
</body>
</html>
