<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Multimedia Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Multimedia Page</h1>

    <!-- Favourite Photo Section -->
    <div class="section-box">
        <div class="section-title">Favourite Photo</div>
        <img src="Bilat.jpg" alt="Photo 1" class="custom-img">
        <img src="OC.jpg" alt="Photo 2" class="custom-img">
        <img src="hutao.jpg" alt="Photo 3" class="custom-img">
        <img src="red_field.jpg" alt="Photo 4" class="custom-img">
        <img src="Teehee.jpg" alt="Photo 5" class="custom-img">
    </div>

    <!-- Music List Section -->
    <div class="section-box">
        <div class="section-title">Music List</div>
        <audio controls src="audio1.mp3"></audio>
        <audio controls src="audio2.mp3"></audio>
        <audio controls src="audio3.mp3"></audio>
        <audio controls src="audio4.mp3"></audio>
        <audio controls src="audio5.mp3"></audio>
    </div>

    <!-- Video List Section -->
    <div class="section-box">
        <div class="section-title">Video Clips</div>
        <video controls width="200" src="video1.mp4"></video>
        <video controls width="200" src="video2.mp4"></video>
        <video controls width="200" src="video3.mp4"></video>
        <video controls width="200" src="video4.mp4"></video>
        <video controls width="200" src="video5.mp4"></video>
    </div>

</body>
</html>
